[platformio]
default_envs = puck, light

[env]
lib_deps =
  kmackay/micro-ecc@^1.0.0

[env:native]
platform = native
test_build_src = no
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags = -std=gnu11 -Wall -DuECC_SUPPORTS_secp256k1=1

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.35.9
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
build_flags = -DuECC_SUPPORTS_secp256k1=1 -DuECC_SUPPORTS_secp160r1=0 -DuECC_SUPPORTS_secp192r1=0 -DuECC_SUPPORTS_secp224r1=0 -DuECC_SUPPORTS_secp256r1=0 -DCORE_DEBUG_LEVEL=0
  -DuECC_compress=hisn_uECC_compress -DuECC_compute_public_key=hisn_uECC_compute_public_key -DuECC_curve_b=hisn_uECC_curve_b -DuECC_curve_n=hisn_uECC_curve_n -DuECC_curve_num_bits=hisn_uECC_curve_num_bits -DuECC_curve_num_bytes=hisn_uECC_curve_num_bytes -DuECC_curve_num_n_bits=hisn_uECC_curve_num_n_bits -DuECC_curve_num_n_bytes=hisn_uECC_curve_num_n_bytes -DuECC_curve_num_n_words=hisn_uECC_curve_num_n_words -DuECC_curve_num_words=hisn_uECC_curve_num_words -DuECC_curve_p=hisn_uECC_curve_p -DuECC_curve_private_key_size=hisn_uECC_curve_private_key_size -DuECC_curve_public_key_size=hisn_uECC_curve_public_key_size -DuECC_decompress=hisn_uECC_decompress -DuECC_generate_random_int=hisn_uECC_generate_random_int -DuECC_get_rng=hisn_uECC_get_rng -DuECC_make_key=hisn_uECC_make_key -DuECC_point_mult=hisn_uECC_point_mult -DuECC_secp160r1=hisn_uECC_secp160r1 -DuECC_secp192r1=hisn_uECC_secp192r1 -DuECC_secp224r1=hisn_uECC_secp224r1 -DuECC_secp256k1=hisn_uECC_secp256k1 -DuECC_secp256r1=hisn_uECC_secp256r1 -DuECC_set_rng=hisn_uECC_set_rng -DuECC_shared_secret=hisn_uECC_shared_secret -DuECC_sign=hisn_uECC_sign -DuECC_sign_deterministic=hisn_uECC_sign_deterministic -DuECC_sign_with_k=hisn_uECC_sign_with_k -DuECC_valid_point=hisn_uECC_valid_point -DuECC_valid_public_key=hisn_uECC_valid_public_key -DuECC_verify=hisn_uECC_verify

[env:puck]
extends = esp32_base
build_src_filter = +<common/> +<puck/>
build_flags = ${esp32_base.build_flags} -DHISN_PUCK=1 -DHISN_ROLE=\"puck\"

[env:light]
extends = esp32_base
build_src_filter = +<common/> +<light/>
build_flags = ${esp32_base.build_flags} -DHISN_LIGHT=1 -DHISN_ROLE=\"light\"

[env:puck_sim]
extends = env:puck
build_flags = ${env:puck.build_flags} -DHISN_SIM=1

[env:light_sim]
extends = env:light
build_flags = ${env:light.build_flags} -DHISN_SIM=1
