<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisn phone: send</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#0B1F3A;text-decoration:none}a:hover{color:#0F6B48}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; padding: 56px 20px 30px; display: flex; flex-direction: column; gap: 20px; font-family: 'Figtree', sans-serif; color: #0B1F3A">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="m-home.html" style="font-size: 16px; font-weight: 700; color: #4B5B73">Cancel</a>
    <div style="font-size: 18px; font-weight: 800">Send money</div>
    <div style="width: 52px"></div>
  </div>

  <div>
    <div style="font-size: 15px; font-weight: 800; color: #4B5B73; margin-bottom: 8px">To</div>
    <div style="display: flex; gap: 14px">
      
        <button style="font: inherit; background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #0B1F3A; font-size: 13px; font-weight: 700; width: 64px"><span style="width: 54px; height: 54px; border-radius: 50%; background: #0B1F3A; color: #FFFFFF; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center">S</span>Sami</button>
      
        <button style="font: inherit; background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #0B1F3A; font-size: 13px; font-weight: 700; width: 64px"><span style="width: 54px; height: 54px; border-radius: 50%; background: #0B1F3A; color: #FFFFFF; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center">P</span>Pharmacy</button>
      
        <button style="font: inherit; background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #0B1F3A; font-size: 13px; font-weight: 700; width: 64px"><span style="width: 54px; height: 54px; border-radius: 50%; background: #0B1F3A; color: #FFFFFF; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center">I</span>Internet</button>
      
        <button style="font: inherit; background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #0B1F3A; font-size: 13px; font-weight: 700; width: 64px"><span style="width: 54px; height: 54px; border-radius: 50%; background: #0B1F3A; color: #FFFFFF; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center">L</span>Landlord</button>
      
    </div>
    <label style="display: flex; align-items: center; gap: 10px; margin-top: 14px; height: 58px; box-sizing: border-box; border: 2px solid #0B1F3A; border-radius: 16px; padding: 0 14px">
      <input type="text" value="0x5aAe ... 1BeAed" aria-label="Recipient address" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 16px; font-weight: 700; color: #0B1F3A; background: transparent">
      <span style="font-size: 12px; font-weight: 800; background: #FBF0D9; color: #6B4E00; padding: 5px 10px; border-radius: 999px; flex: none">New</span>
    </label>
  </div>

  <div style="text-align: center; padding: 14px 0 4px">
    <div style="font-size: 76px; font-weight: 900; letter-spacing: -3px; line-height: 1">100.00</div>
    <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; background: #EEF2F8; padding: 8px 16px; border-radius: 999px; margin-top: 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #2775CA; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">$</span>USDC</div>
    <div style="font-size: 14px; color: #4B5B73; margin-top: 10px">You have 150.00 USDC</div>
  </div>

  <div style="background: #FBF0D9; border-radius: 20px; padding: 16px 18px; color: #3D3210">
    <div style="font-size: 17px; font-weight: 800; color: #0B1F3A">This will wait 3 minutes</div>
    <div style="font-size: 14px; margin-top: 3px; line-height: 1.4">It is a new recipient. Sami will be alerted and can stop it during the wait.</div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; color: #4B5B73; text-align: center">Next: check the address on your puck and hold Yes.</div>
    <a href="m-payment.html" style="text-align: center; font-size: 19px; font-weight: 800; padding: 19px 0; border-radius: 999px; background: #1D4ED8; color: #FFFFFF">Continue on your puck</a>
  </div>
</div>
</body>
</html>
